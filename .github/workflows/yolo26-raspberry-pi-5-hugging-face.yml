# Mirror each qualified GitHub release to the model's Hugging Face repository.
# The Hub trusted publisher must match this repository and workflow filename.
name: Mirror YOLO26n Raspberry Pi 5 release to Hugging Face

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: hugging-face-yolo26-raspberry-pi-5
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      ${{ github.event.release.prerelease == false &&
          startsWith(github.event.release.tag_name, 'yolo26-raspberry-pi-5-v') }}
    name: Mirror release
    runs-on: ubuntu-24.04
    env:
      HF_REPO_ID: Arm/Arm-Runtime-for-YOLO26-on-Raspberry-Pi-5
      PROJECT_DIR: yolo26-raspberry-pi-5
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify and stage the released snapshot
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(cat "$PROJECT_DIR/VERSION")"
          expected_tag="yolo26-raspberry-pi-5-v$version"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "release tag must be $expected_tag" >&2
            exit 1
          }
          test "$(git rev-list --max-count=1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" || {
            echo 'checked-out commit does not match the release tag' >&2
            exit 1
          }

          mirror="$RUNNER_TEMP/hugging-face-mirror"
          mkdir "$mirror"
          git archive "HEAD:$PROJECT_DIR" | tar --extract --directory "$mirror"
          install --mode 0644 LICENSE "$mirror/LICENSE"

          forbidden="$(find "$mirror" \
            \( -type d \( -name build -o -name dist -o -name downloads \
              -o -name results -o -name runs -o -name .venv -o -name output \) \
            -o -type f \( -name model.bin -o -name '*.pt' -o -name '*.pth' \
              -o -name '*.safetensors' \) \) -print -quit)"
          test -z "$forbidden" || {
            echo "release snapshot contains excluded path: $forbidden" >&2
            exit 1
          }
          test -f "$mirror/README.md"
          test -f "$mirror/metadata.yaml"
          test -f "$mirror/benchmark/accuracy.yaml"
          grep --fixed-strings --line-regexp "id: $HF_REPO_ID" \
            "$mirror/metadata.yaml"
          grep --fixed-strings --line-regexp \
            'filename: MODEL_FILE_NOT_DISTRIBUTED' "$mirror/metadata.yaml"

          {
            echo "HF_RELEASE_TAG=v$version"
            echo "MIRROR_DIR=$mirror"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Mirror the release to Hugging Face
        env:
          HF_OIDC_RESOURCE: ${{ env.HF_REPO_ID }}
        run: |
          set -euo pipefail
          HF=(uvx hf@1.31.0)
          "${HF[@]}" upload "$HF_REPO_ID" "$MIRROR_DIR" . \
            --type model \
            --delete '*' \
            --commit-message "Release $RELEASE_TAG" \
            --commit-description \
              "Mirrored from https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

          main_sha="$("${HF[@]}" models info "$HF_REPO_ID" \
            --revision main --format json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')"
          if tag_json="$("${HF[@]}" models info "$HF_REPO_ID" \
              --revision "$HF_RELEASE_TAG" --format json 2>/dev/null)"; then
            tag_sha="$(python3 -c \
              'import json, sys; print(json.load(sys.stdin)["sha"])' \
              <<< "$tag_json")"
            test "$tag_sha" = "$main_sha" || {
              echo "Hugging Face tag $HF_RELEASE_TAG already points to $tag_sha" >&2
              exit 1
            }
          else
            "${HF[@]}" repos tag create "$HF_REPO_ID" "$HF_RELEASE_TAG" \
              --revision "$main_sha" \
              --message "Release $RELEASE_TAG"
          fi
