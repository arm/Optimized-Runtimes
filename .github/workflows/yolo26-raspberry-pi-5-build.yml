name: Build YOLO26n for Raspberry Pi 5

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  # The build reads the checkout and does not modify GitHub state.
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04-arm
    env:
      PROJECT_DIR: yolo26-raspberry-pi-5
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    steps:
      - name: Install Trixie build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            patch \
            python3 \
            python3-venv
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure container workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: make lint
      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: make test-unit
      - name: Download supported converter fixture
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/ci
          curl --fail --location --output build/ci/yolo26n.pt \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
          echo '9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef  build/ci/yolo26n.pt' \
            | sha256sum --check
      - name: Check model conversion
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          make model-check \
            CHECKPOINT=build/ci/yolo26n.pt \
            RESOLUTION=640
      - name: Export supported models
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for resolution in 320 480 640 800 960 1280; do
            make model \
              CHECKPOINT=build/ci/yolo26n.pt \
              RESOLUTION="$resolution"
          done
      - name: End-to-end tests and release packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          make test-end-to-end release \
            CHECKPOINT=build/ci/yolo26n.pt \
            MODELS="$PWD/dist/models/yolo26n-320:$PWD/dist/models/yolo26n-480:$PWD/dist/models/yolo26n-640:$PWD/dist/models/yolo26n-800:$PWD/dist/models/yolo26n-960:$PWD/dist/models/yolo26n-1280"
      - name: Retain main build packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-build-${{ github.sha }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/packages/arm-yolo26n-*-rpi5-trixie-arm64.tar.gz
            ${{ env.PROJECT_DIR }}/dist/packages/arm-yolo26n-*-rpi5-trixie-arm64.tar.gz.sha256
            ${{ env.PROJECT_DIR }}/dist/packages/arm-yolo26n-*-rpi5-trixie-arm64-dev.tar.gz
            ${{ env.PROJECT_DIR }}/dist/packages/arm-yolo26n-*-rpi5-trixie-arm64-dev.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
