name: Black Duck

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-duck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan ${{ matrix.closure }} closure
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    strategy:
      fail-fast: false
      matrix:
        include:
          - closure: runtime
            directory: build/blackduck/runtime/sources
            distribution: EXTERNAL
            detect_args: >-
              --detect.tools=SIGNATURE_SCAN
              --detect.blackduck.signature.scanner.upload.source.mode=false
              --detect.blackduck.signature.scanner.snippet.matching=NONE
              --detect.blackduck.signature.scanner.license.search=true
          - closure: examples
            directory: build/blackduck/examples
            distribution: EXTERNAL
            detect_args: --detect.tools=DETECTOR --detect.detector.search.depth=0
          - closure: build
            directory: build/blackduck/build
            distribution: INTERNAL
            detect_args: --detect.tools=DETECTOR --detect.detector.search.depth=0
          - closure: ultralytics
            directory: build/blackduck/ultralytics
            distribution: INTERNAL
            detect_args: --detect.tools=DETECTOR --detect.detector.search.depth=3
    env:
      PIP_CONFIG_FILE: /dev/null
      DETECT_PROJECT_NAME: ${{ vars.BLACKDUCK_PROJECT_NAME || 'Loom' }}
      DETECT_PROJECT_VERSION_DISTRIBUTION: ${{ matrix.distribution }}
      DETECT_PROJECT_VERSION_LICENSE: Apache License 2.0
      DETECT_PROJECT_VERSION_UPDATE: "true"
    steps:
      - name: Install scan prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            default-jre-headless \
            git \
            patch \
            python3 \
            python3-venv \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure container workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set scan identity
        env:
          CLOSURE: ${{ matrix.closure }}
        run: |
          revision="${GITHUB_SHA:0:8}"
          echo "DETECT_PROJECT_VERSION_NAME=${revision}-${CLOSURE}" >> "$GITHUB_ENV"
          echo "DETECT_CODE_LOCATION_NAME=loom-${CLOSURE}-${revision}" >> "$GITHUB_ENV"

      - name: Require Black Duck configuration
        env:
          BLACKDUCK_URL: ${{ vars.BLACKDUCK_URL }}
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
        run: |
          if [[ -z "$BLACKDUCK_URL" ]]; then
            echo 'BLACKDUCK_URL must be configured as a repository or organization variable' >&2
            exit 1
          fi
          if [[ -z "$BLACKDUCK_TOKEN" ]]; then
            echo 'BLACKDUCK_TOKEN must be configured as a protected Actions secret' >&2
            exit 1
          fi

      - name: Prepare ${{ matrix.closure }} closure
        env:
          CLOSURE: ${{ matrix.closure }}
          SCAN_DIRECTORY: ${{ matrix.directory }}
        run: |
          case "$CLOSURE" in
            runtime)
              make runtime-configure \
                RUNTIME_BUILD="$GITHUB_WORKSPACE/build/blackduck/runtime"
              mapfile -t dependency_sources < <(
                find "$SCAN_DIRECTORY" -mindepth 1 -maxdepth 1 -type d -print | sort
              )
              if [[ "${#dependency_sources[@]}" -ne 4 ]]; then
                echo "expected four fetched runtime source trees, found ${#dependency_sources[@]}" >&2
                exit 1
              fi
              ;;
            examples)
              mkdir -p "$SCAN_DIRECTORY"
              cp requirements.txt "$SCAN_DIRECTORY/requirements.txt"
              python3 -m venv build/blackduck/examples-venv
              build/blackduck/examples-venv/bin/python -m pip install \
                --requirement requirements.txt
              echo "$GITHUB_WORKSPACE/build/blackduck/examples-venv/bin" >> "$GITHUB_PATH"
              ;;
            build)
              mkdir -p "$SCAN_DIRECTORY"
              python3 - "$SCAN_DIRECTORY/requirements.txt" <<'PY'
          import pathlib
          import sys
          import tomllib

          configuration = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          requirements = configuration["build-system"]["requires"]
          pathlib.Path(sys.argv[1]).write_text("\n".join(requirements) + "\n")
          PY
              python3 -m venv build/blackduck/build-venv
              build/blackduck/build-venv/bin/python -m pip install \
                --requirement "$SCAN_DIRECTORY/requirements.txt"
              echo "$GITHUB_WORKSPACE/build/blackduck/build-venv/bin" >> "$GITHUB_PATH"
              ;;
            ultralytics)
              mkdir -p "$SCAN_DIRECTORY/benchmarks/ultralytics"
              cp requirements.txt "$SCAN_DIRECTORY/requirements.txt"
              cp benchmarks/ultralytics/requirements.txt \
                "$SCAN_DIRECTORY/benchmarks/ultralytics/requirements.txt"
              python3 -m venv build/blackduck/ultralytics-venv
              build/blackduck/ultralytics-venv/bin/python -m pip install \
                --requirement benchmarks/ultralytics/requirements.txt
              echo "$GITHUB_WORKSPACE/build/blackduck/ultralytics-venv/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unsupported Black Duck closure: $CLOSURE" >&2
              exit 1
              ;;
          esac

      - name: Scan ${{ matrix.closure }} closure
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
        with:
          blackducksca_url: ${{ vars.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_waitForScan: true
          project_directory: ${{ matrix.directory }}
          detect_args: ${{ matrix.detect_args }}
