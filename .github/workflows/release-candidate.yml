# Promote the packages retained by a successful main build into a draft GitHub
# release after its Black Duck result has been reviewed. This workflow verifies
# the retained files and never rebuilds them.
name: Create release candidate

on:
  workflow_dispatch:
    inputs:
      black_duck_reviewed:
        description: Confirm that the successful Black Duck result and BOM were reviewed
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    name: Create draft release
    runs-on: ubuntu-24.04-arm
    environment: release-candidate
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release selection
        env:
          BLACK_DUCK_REVIEWED: ${{ inputs.black_duck_reviewed }}
        run: |
          release_revision="$(git rev-parse HEAD)"
          release_version="$(cat VERSION)"
          test "$release_revision" = "$GITHUB_SHA" || {
            echo 'checked-out commit does not match the workflow commit' >&2
            exit 1
          }
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'VERSION must use major.minor.patch form' >&2
            exit 1
          }
          test "$BLACK_DUCK_REVIEWED" = true || {
            echo 'Black Duck review must be confirmed' >&2
            exit 1
          }
          if gh release view "v$release_version" >/dev/null 2>&1; then
            echo "release v$release_version already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$release_version" \
              >/dev/null 2>&1; then
            echo "tag v$release_version already exists" >&2
            exit 1
          fi
          {
            echo "RELEASE_REVISION=$release_revision"
            echo "RELEASE_VERSION=$release_version"
          } >> "$GITHUB_ENV"

      - name: Find successful build and Black Duck runs
        id: find_runs
        run: |
          build="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$RELEASE_REVISION" -f event=push -f status=success \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.id, .html_url] | @tsv')"
          read -r build_run_id build_run_url <<<"$build"
          test -n "$build_run_id" && test "$build_run_id" != null || {
            echo 'no successful main build exists for the selected commit' >&2
            exit 1
          }

          black_duck="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/blackduck.yml/runs" \
            -f head_sha="$RELEASE_REVISION" -f event=push -f status=success \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.id, .html_url] | @tsv')"
          read -r black_duck_run_id black_duck_run_url <<<"$black_duck"
          test -n "$black_duck_run_id" && test "$black_duck_run_id" != null || {
            echo 'no successful Black Duck run exists for the selected commit' >&2
            exit 1
          }

          {
            echo "build_run_id=$build_run_id"
            echo "build_run_url=$build_run_url"
            echo "black_duck_run_url=$black_duck_run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Download retained build packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-build-${{ github.sha }}
          path: build/release/input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_runs.outputs.build_run_id }}

      - name: Verify retained release packages
        run: |
          packages="$PWD/build/release/input"
          runtime="arm_yolo26n-$RELEASE_VERSION-py3-none-linux_aarch64.whl"
          converter="arm_yolo26n_converter-$RELEASE_VERSION-py3-none-any.whl"
          test "$(find "$packages" -maxdepth 1 -type f | wc -l)" -eq 4
          test -f "$packages/$runtime"
          test -f "$packages/$runtime.sha256"
          test -f "$packages/$converter"
          test -f "$packages/$converter.sha256"
          (cd "$packages" && sha256sum --check "$runtime.sha256")
          (cd "$packages" && sha256sum --check "$converter.sha256")

          PACKAGES="$packages" RUNTIME="$runtime" python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path(os.environ["PACKAGES"], os.environ["RUNTIME"])
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
          required_suffixes = {
              "arm_yolo26n/libarm-yolo26n.so.0",
              "licenses/LICENSE",
              "licenses/licenses/cpuinfo/LICENSE",
              "licenses/licenses/fxdiv/LICENSE",
              "licenses/licenses/pthreadpool/LICENSE",
              "licenses/licenses/xnnpack/LICENSE",
          }
          for suffix in required_suffixes:
              if not any(name.endswith(suffix) for name in files):
                  raise SystemExit(f"runtime wheel is missing {suffix}")
          PY

      - name: Create draft release
        env:
          BUILD_RUN_URL: ${{ steps.find_runs.outputs.build_run_url }}
          BLACK_DUCK_RUN_URL: ${{ steps.find_runs.outputs.black_duck_run_url }}
        run: |
          cat > build/release/notes.md <<EOF
          ## Raspberry Pi 5 release candidate

          Qualification status: pending

          Source commit: \`$RELEASE_REVISION\`

          [Build and test run]($BUILD_RUN_URL)

          [Black Duck run]($BLACK_DUCK_RUN_URL)

          Install the candidate in a clean Python environment:

          ~~~sh
          python3 -m venv .venv
          .venv/bin/python -m pip install \
            arm_yolo26n-$RELEASE_VERSION-py3-none-linux_aarch64.whl \
            arm_yolo26n_converter-$RELEASE_VERSION-py3-none-any.whl
          ~~~

          The application wheel installs the qualified runtime library and
          selects it automatically.

          This draft must not be published until the exact attached files have
          completed Raspberry Pi 5 qualification and human review.
          EOF
          gh release create "v$RELEASE_VERSION" build/release/input/* \
            --draft \
            --target "$RELEASE_REVISION" \
            --title "Arm Runtime for YOLO26n $RELEASE_VERSION" \
            --notes-file build/release/notes.md
